name: Lichess Data Pipeline

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Lichess username to fetch data for'
        required: true
        type: string

jobs:
  fetch-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install -r requirements.txt

      - name: Create credentials file
        run: |
          echo "${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}" | base64 -d > credentials.json
          echo "LICHESS_TOKEN=${{ secrets.LICHESS_TOKEN }}" > .env
          echo "DRIVE_PARENT_FOLDER_ID=${{ secrets.DRIVE_PARENT_FOLDER_ID }}" >> .env

      - name: Run all scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./credentials.json
          LICHESS_USERNAME: ${{ github.event.inputs.username }}
        run: |
          if [[ ! "$LICHESS_USERNAME" =~ ^[A-Za-z0-9_-]{2,30}$ ]]; then
            echo "Error: Invalid Lichess username format." >&2
            exit 1
          fi
          python run_all_scripts.py "$LICHESS_USERNAME"

      - name: Clean up
        if: always()
        run: rm -rf credentials.json .env *.json *.csv "Player Data" || true
